# Main 3-seed 2^4 factorial experiment (brief sections 1, 3, 29-A, 37-P1).
#
#   dataset  = v2
#   seeds    = [42, 43, 44]      (documented three-seed convention)
#   configs  = all 16 X-ABCD     (A=BBS  B=TLC  C=RoPE  D=ALiBi)
#   => 16 x 3 = 48 training runs, v2 ONLY.
#
# This file is ALSO valid as configs/experiments/factorial_16.yaml (identical).

experiment: factorial
run_group: factorial
dataset_version: v2
model_key: nllb

seeds: [42, 43, 44]
configs: all           # 'all' -> the canonical 16; or an explicit list of X-ABCD ids

# Shared training budget applied to every one of the 48 runs.  The runner /
# RunConfig.resolve() layers the X-ABCD flags and per-arch budget tweaks
# (RoPE -> max_input_length 1024; ALiBi -> half batch, double accumulation)
# on top of these.
defaults:
  num_train_epochs: 20
  per_device_train_batch_size: 32          # probe start; halves on OOM per model (see _autoscale_micro_batch)
  auto_find_batch_size: true               # 32 -> 16 -> 8 ... until it fits
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  lr_scheduler_type: cosine
  label_smoothing: 0.1
  fp16: true
  dataloader_num_workers: 0   # was 2; multiprocessing workers hung the run on a transient /tmp disk-quota EDQUOT (2026-09-15)
  optimizer: adamw_torch

  bucket_boundaries: [5, 10, 15, 20]
  # Manual BBS vector from the current paper (mean-normalised to sum=5 inside
  # the sampler).  The grid search (section 6-11) may replace this.
  bucket_weights: [1.0, 1.0, 1.2, 1.5, 2.0]
  bbs_deterministic: true

  length_loss_lambda: 0.1
  length_loss_epsilon: 1.0

  # Checkpoint selection + COMET cadence use VALIDATION only (section 28).
  eval_strategy: epoch
  save_strategy: epoch
  eval_every_n_epochs: 5        # validate + checkpoint every 5 epochs, not every epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_bleu
  greater_is_better: true
  comet_eval_every: 5
  train_eval_num_beams: 1
  final_eval_num_beams: 4
  deterministic: true

# Final held-out evaluation (run once, after training, frozen config).
evaluation:
  eval_corpora: [v2]                # eval on v2 first; v1 done later, after v2 finishes for nllb+mbart
  test_variants: [unsampled]        # reviewer: skip the bucket-balanced "sampled" set; use raw test.sa
  splits: [test]
  test_split_file: test_7264_5     # equal-ish bucket test set; 'test' also available
  num_beams: 4
  metrics: [bleu, chrf2, ter, meteor, bertscore, comet]
  bucket_boundaries: [5, 10, 15, 20]
